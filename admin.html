<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEG Mission Control</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰️</text></svg>">
<!--
  Live Event Gateway — Admin / Mission Control
  v0.3 — Mission-Control look, Firebase-wired (realtime, no apikey).
  Google auth · live agent table · arm-or-fire bulk · Attend/Present · drop alerts · confirms on all actions.
-->
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .active-row { background-color: rgba(34,197,94,0.08); border-left: 4px solid #16a34a; }
  .error-row  { background-color: rgba(239,68,68,0.07); border-left: 4px solid #dc2626; }
  .offline-row{ opacity: 0.55; }
  [hidden] { display: none !important; }
  .pulse { animation: pulse 1.4s ease-in-out infinite; } @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
</style>
</head>
<body class="bg-white text-slate-900 antialiased p-3">

<!-- ══ SIGN IN ══ -->
<div id="signin" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center gap-5 p-8 text-center">
  <div class="text-2xl font-black tracking-tight">LIVE EVENT GATEWAY <span class="text-blue-600 font-bold text-lg">Mission Control</span></div>
  <p class="text-slate-500 max-w-sm">Sign in with your Wordly Google account to see and control room agents.</p>
  <button onclick="doSignIn()" class="flex items-center gap-3 bg-white border shadow-sm rounded-lg px-6 py-3 text-base font-bold hover:bg-slate-50">
    <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.7 1.22 9.2 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
    Sign in with Google
  </button>
  <div class="text-red-500 text-sm" id="signin-err"></div>
</div>

<!-- ══ APP ══ -->
<div id="app" hidden>
  <nav class="flex justify-between items-center mb-4 pb-2 border-b border-slate-200">
    <div class="text-xl font-black tracking-tight">LIVE EVENT GATEWAY <span class="text-blue-600 font-bold text-sm align-middle">Mission Control</span></div>
    <div class="flex items-center gap-4">
      <span class="text-sm text-slate-500" id="who-email"></span>
      <span class="flex items-center gap-1.5 text-xs font-bold text-green-600"><span class="w-2 h-2 rounded-full bg-green-500 pulse"></span>REALTIME</span>
      <button onclick="doSignOut()" class="bg-slate-900 text-white px-3 py-2 rounded-lg text-sm font-bold hover:bg-red-600 transition-colors">Sign out</button>
    </div>
  </nav>

  <header class="mb-3 flex flex-wrap gap-3 items-center bg-slate-100 p-2 rounded-xl border border-slate-200">
    <div class="w-full md:w-64">
      <input type="text" id="search" placeholder="Search room, session, device…" class="w-full px-4 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 text-base">
    </div>

    <!-- Bulk arm-or-fire -->
    <div class="flex items-center gap-2">
      <span class="text-xs font-black uppercase text-slate-400 tracking-widest pr-1">Bulk</span>
      <button id="bulk-start" onclick="armOrFire('start')" class="border px-3 py-2 rounded-lg text-xs font-bold uppercase bg-white hover:bg-slate-50">▶ Start</button>
      <button id="bulk-mute"  onclick="armOrFire('mute')"  class="border px-3 py-2 rounded-lg text-xs font-bold uppercase bg-white hover:bg-slate-50">⏸ Mute</button>
      <button id="bulk-split" onclick="armOrFire('split')" class="border px-3 py-2 rounded-lg text-xs font-bold uppercase bg-white hover:bg-slate-50">✂ Split</button>
      <button id="bulk-end"   onclick="armOrFire('end')"   class="border px-3 py-2 rounded-lg text-xs font-bold uppercase bg-white hover:bg-slate-50">■ End</button>
      <button id="bulk-cancel" onclick="cancelArm()" hidden class="text-slate-500 hover:text-slate-800 px-2 text-lg font-black" title="Cancel">&times;</button>
    </div>

    <label class="flex items-center gap-2 px-2 cursor-pointer"><input type="checkbox" id="alertDrops" class="w-5 h-5 cursor-pointer"><span class="text-xs font-black uppercase">Alert Drops</span></label>
    <button onclick="clearOffline()" class="border px-3 py-2 rounded-lg text-xs font-bold uppercase bg-white hover:bg-slate-50 text-slate-500">Clear offline</button>

    <div class="flex gap-3 items-center ml-auto">
      <div id="activeBox" onclick="toggleFilter('active')" title="Click to show only active rooms" class="cursor-pointer bg-green-50 border border-green-200 px-4 py-1.5 rounded-lg text-center transition-all">
        <span class="text-xs font-black text-green-700 uppercase">Active</span><p id="activeCount" class="text-2xl font-black text-green-900 leading-none">0</p>
      </div>
      <div id="inactiveBox" onclick="toggleFilter('inactive')" title="Click to show only inactive rooms" class="cursor-pointer bg-white border px-4 py-1.5 rounded-lg text-center transition-all">
        <span class="text-xs font-black text-slate-500 uppercase">Inactive</span><p id="inactiveCount" class="text-2xl font-black leading-none">0</p>
      </div>
    </div>
  </header>

  <div id="dropBanner" hidden class="mb-3 bg-red-600 text-white rounded-xl p-3 space-y-1"></div>

  <div class="overflow-x-auto border border-slate-200 rounded-xl bg-white shadow-sm">
    <table class="w-full text-left text-sm">
      <thead class="bg-slate-900 text-slate-200 text-xs uppercase font-black tracking-widest">
        <tr>
          <th class="px-2 py-3 w-10"><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)" hidden class="w-4 h-4 cursor-pointer"></th>
          <th class="px-3 py-3 w-28 cursor-pointer select-none hover:bg-slate-800" onclick="setSort('status')">Status<span id="sort-status"></span></th>
          <th class="px-3 py-3 cursor-pointer select-none hover:bg-slate-800" onclick="setSort('room')">Room<span id="sort-room"></span></th>
          <th class="px-3 py-3 cursor-pointer select-none hover:bg-slate-800" onclick="setSort('session')">Session<span id="sort-session"></span></th>
          <th class="px-3 py-3 cursor-pointer select-none hover:bg-slate-800" onclick="setSort('device')">Device<span id="sort-device"></span></th>
          <th class="px-3 py-3 w-32 cursor-pointer select-none hover:bg-slate-800" onclick="setSort('age')">Session Age<span id="sort-age"></span></th>
          <th class="px-3 py-3 text-right">Actions</th>
        </tr>
      </thead>
      <tbody id="tbody" class="divide-y divide-slate-100"></tbody>
    </table>
  </div>
  <div id="empty" class="text-center text-slate-400 italic font-bold uppercase tracking-widest py-16" hidden>No agents checked in yet — open the agent page on a device.</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
  const db = firebase.database();
  const auth = firebase.auth();
  let agentsRef = null;

  // ── State ──
  let agentData   = {};     // id -> agent record (latest)
  let prevStatus  = {};     // id -> last seen status (for drop detection)
  let selected    = {};     // id -> true (bulk selection)
  let armMode     = null;   // null | 'start' | 'mute' | 'split' | 'end'
  let filter      = null;   // null | 'active' | 'inactive'
  let sortKey     = null;   // null (default sort) | status|room|session|device|age
  let sortDir     = 1;      // 1 asc, -1 desc
  let intentional = {};     // id -> true : we commanded end/leave, suppress drop alert
  let dropAlerts  = [];     // {id, name, at}
  let audioCtx    = null;

  const STREAMING = ['live','muted','connecting','reconnecting'];
  const isStreaming = s => STREAMING.indexOf((s||'').toLowerCase()) !== -1;
  const SEV = { live:0, reconnecting:1, connecting:2, muted:3, error:4, ended:5, idle:6, offline:7 };

  // ── Column sorting ──
  function setSort(key){
    if (sortKey === key) sortDir = -sortDir; else { sortKey = key; sortDir = 1; }
    render();
  }
  function sortRows(rows){
    if (!sortKey){ // default: live first, then name
      return rows.sort((a,b)=> (isStreaming(statusOf(b))?1:0)-(isStreaming(statusOf(a))?1:0) || String(a.label||'').localeCompare(String(b.label||'')));
    }
    return rows.sort((a,b)=>{
      let av, bv;
      switch(sortKey){
        case 'status':  av = (SEV[statusOf(a)]!=null?SEV[statusOf(a)]:9); bv = (SEV[statusOf(b)]!=null?SEV[statusOf(b)]:9); break;
        case 'session': av = String(a.sessionId||'').toLowerCase();  bv = String(b.sessionId||'').toLowerCase();  break;
        case 'device':  av = String(a.deviceLabel||'').toLowerCase(); bv = String(b.deviceLabel||'').toLowerCase(); break;
        case 'age':     // streaming by startedAt (oldest = longest-running first); idle/offline sink to bottom
          av = isStreaming(statusOf(a)) ? (a.startedAt||Infinity) : Number.MAX_VALUE;
          bv = isStreaming(statusOf(b)) ? (b.startedAt||Infinity) : Number.MAX_VALUE;
          break;
        default:        av = String(a.label||'').toLowerCase(); bv = String(b.label||'').toLowerCase(); // room
      }
      if (av < bv) return -sortDir;
      if (av > bv) return sortDir;
      return 0;
    });
  }
  function updateSortUI(){
    ['status','room','session','device','age'].forEach(k=>{
      const el = document.getElementById('sort-'+k);
      if (el) el.textContent = (sortKey===k) ? (sortDir===1?' ▲':' ▼') : '';
    });
  }

  // ── Auth ──
  function doSignIn() {
    document.getElementById('signin-err').textContent = '';
    auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())
      .catch(e => document.getElementById('signin-err').textContent = e.message || 'Sign-in failed.');
  }
  function doSignOut() { auth.signOut(); }
  auth.onAuthStateChanged(user => {
    if (user) {
      document.getElementById('signin').hidden = true;
      document.getElementById('app').hidden = false;
      document.getElementById('who-email').textContent = user.email || user.displayName || '';
      startWatching();
    } else {
      document.getElementById('app').hidden = true;
      document.getElementById('signin').hidden = false;
      if (agentsRef) { agentsRef.off(); agentsRef = null; }
    }
  });

  // ── Realtime data ──
  function startWatching() {
    if (agentsRef) return;
    agentsRef = db.ref('agents');
    agentsRef.on('value', snap => onData(snap.val() || {}));
  }
  function onData(agents) {
    // Drop detection: streaming -> offline/error that we didn't cause
    Object.keys(agents).forEach(id => {
      const a = agents[id] || {};
      const now = (a.online ? (a.status || 'idle') : 'offline').toLowerCase();
      const was = prevStatus[id];
      const dropped = was && isStreaming(was) && (now === 'offline' || now === 'error');
      if (dropped) {
        if (intentional[id]) { delete intentional[id]; }
        else if (document.getElementById('alertDrops').checked) triggerDrop(id, a);
      }
      prevStatus[id] = now;
    });
    // prune stale
    Object.keys(prevStatus).forEach(id => { if (!agents[id]) delete prevStatus[id]; });
    Object.keys(selected).forEach(id => { if (!agents[id]) delete selected[id]; });
    agentData = agents;
    render();
  }

  // ── Helpers ──
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
  function statusOf(a){ return a.online ? (a.status || 'idle').toLowerCase() : 'offline'; }
  function badge(status){
    const m = {
      live:'bg-green-100 text-green-700', muted:'bg-amber-100 text-amber-700',
      connecting:'bg-blue-100 text-blue-700', reconnecting:'bg-orange-100 text-orange-700 pulse',
      error:'bg-red-100 text-red-700', ended:'bg-slate-100 text-slate-500',
      idle:'bg-slate-100 text-slate-600', offline:'bg-slate-200 text-slate-400'
    };
    return m[status] || 'bg-slate-100 text-slate-500';
  }
  function fmtDur(ms){
    if (ms < 0) ms = 0;
    const s = Math.floor(ms/1000);
    return [Math.floor(s/3600),Math.floor((s%3600)/60),s%60].map(n=>String(n).padStart(2,'0')).join(':');
  }
  function ago(ts){
    if(!ts) return '';
    const s = Math.floor((Date.now()-ts)/1000);
    if(s<60) return s+'s ago'; if(s<3600) return Math.floor(s/60)+'m ago'; return Math.floor(s/3600)+'h ago';
  }
  // which agents are eligible for the currently-armed bulk action
  function eligible(a){
    const st = statusOf(a);
    if (!a.online) return false;
    switch(armMode){
      case 'start': return st==='idle' && a.configReady;
      case 'mute':  return st==='live';
      case 'split': return st==='live' || st==='muted';
      case 'end':   return isStreaming(st);
      default:      return false;
    }
  }

  // ── Render ──
  function render(){
    const q = document.getElementById('search').value.toLowerCase();
    const ids = Object.keys(agentData);
    let active = 0, inactive = 0;
    ids.forEach(id => { isStreaming(statusOf(agentData[id])) ? active++ : inactive++; });
    document.getElementById('activeCount').textContent = active;
    document.getElementById('inactiveCount').textContent = inactive;
    document.title = (active>0?`(${active}) `:'') + 'LEG Mission Control';

    let rows = ids.map(id => Object.assign({id}, agentData[id])).filter(a => {
      const st = statusOf(a);
      if (filter==='active' && !isStreaming(st)) return false;
      if (filter==='inactive' && isStreaming(st)) return false;
      const hay = [(a.label||''),(a.sessionId||''),(a.deviceLabel||''),a.id].join(' ').toLowerCase();
      return hay.includes(q);
    });
    rows = sortRows(rows);

    const tbody = document.getElementById('tbody');
    document.getElementById('empty').hidden = ids.length !== 0;
    tbody.innerHTML = rows.map(a => rowHtml(a)).join('');
    updateArmUI();
    updateFilterUI();
    updateSortUI();
    tick(); // paint ages immediately
  }

  function rowHtml(a){
    const id = a.id, st = statusOf(a);
    const streaming = isStreaming(st);
    const rowCls = st==='error' ? 'error-row' : (streaming ? 'active-row' : (a.online?'':'offline-row'));
    const showCb = armMode && eligible(a);
    const checked = selected[id] ? 'checked' : '';
    const sid = a.sessionId || '';
    const pass = a.passcode || '';
    const attend  = sid ? `https://attend.wordly.ai/enter/${encodeURIComponent(sid)}` : '';
    const present = sid ? `https://join.wordly.ai/enter/${encodeURIComponent(sid)}${pass?`?key=${encodeURIComponent(pass)}`:''}` : '';

    // per-row action enablement
    const canStart  = a.online && st==='idle' && a.configReady;
    const canMute   = a.online && st==='live';
    const canUnmute = a.online && st==='muted';
    const canSplit  = a.online && (st==='live'||st==='muted');
    const canLeave  = a.online && streaming;
    const canEnd    = a.online && streaming;
    const b = (ok,cls,label,act) => `<button ${ok?'':'disabled'} onclick="rowCmd('${id}','${act}')" class="px-2 py-1 rounded text-xs font-bold ${ok?cls:'bg-slate-100 text-slate-300 cursor-not-allowed'}">${label}</button>`;

    return `
      <tr class="${rowCls}">
        <td class="px-2 py-3">${showCb?`<input type="checkbox" ${checked} onchange="toggleSel('${id}',this)" class="w-4 h-4 cursor-pointer">`:''}</td>
        <td class="px-3 py-3"><span class="px-2 py-0.5 rounded text-xs font-black uppercase ${badge(st)}">${st}</span>${a.muted&&streaming?'<div class="text-[10px] text-amber-600 font-bold mt-1">MUTED</div>':''}</td>
        <td class="px-3 py-3">
          <div class="font-bold text-base">${esc(a.label||'—')}</div>
          <div class="text-[11px] text-slate-400 font-mono">${esc(id)}</div>
          ${(!a.configReady && a.online)?'<div class="text-[11px] text-amber-600 font-bold">⚠ not configured</div>':''}
        </td>
        <td class="px-3 py-3"><span class="font-mono font-bold text-blue-600 tracking-tight">${esc(sid||'—')}</span></td>
        <td class="px-3 py-3 text-slate-600">${esc(a.deviceLabel||'—')}</td>
        <td class="px-3 py-3 age-cell" data-id="${id}" data-started="${streaming&&a.startedAt?a.startedAt:''}" data-ended="${(!streaming&&a.endedAt)?a.endedAt:''}"></td>
        <td class="px-3 py-3">
          <div class="flex items-center justify-end gap-1.5 whitespace-nowrap">
            ${attend?`<a href="${attend}" target="_blank" class="text-blue-600 text-xs font-black uppercase hover:underline px-1" title="Listen in">Attend</a>`:''}
            ${present?`<a href="${present}" target="_blank" class="bg-slate-900 text-white px-2 py-1 rounded text-xs font-black uppercase hover:bg-blue-600" title="Join as presenter">Present</a>`:''}
            <span class="w-px h-5 bg-slate-200 mx-1"></span>
            ${b(canStart,'bg-blue-600 text-white','▶','start')}
            ${canUnmute?b(true,'bg-green-600 text-white','▶ Unmute','unmute'):b(canMute,'bg-amber-500 text-white','⏸','mute')}
            ${b(canSplit,'bg-green-700 text-white','✂','split')}
            ${b(canLeave,'bg-slate-700 text-white','⤴','leave')}
            ${b(canEnd,'bg-red-600 text-white','■ End','end')}
            <button onclick="removeAgent('${id}')" title="Remove card" class="text-slate-300 hover:text-red-500 px-1 text-sm">✕</button>
          </div>
        </td>
      </tr>`;
  }

  // ── Age ticker (updates every second without full re-render) ──
  function tick(){
    document.querySelectorAll('.age-cell').forEach(td => {
      const started = td.getAttribute('data-started');
      const ended   = td.getAttribute('data-ended');
      if (started) td.innerHTML = `<span class="font-mono font-bold text-slate-800">${fmtDur(Date.now()-Number(started))}</span>`;
      else if (ended) td.innerHTML = `<span class="text-slate-400 text-xs">ended ${ago(Number(ended))}</span>`;
      else td.innerHTML = '<span class="text-slate-300">—</span>';
    });
  }
  setInterval(tick, 1000);

  // ── Filters ──
  function toggleFilter(w){ filter = (filter===w)?null:w; render(); }
  function updateFilterUI(){
    const a = document.getElementById('activeBox'), i = document.getElementById('inactiveBox');
    a.classList.toggle('ring-2', filter==='active');
    a.classList.toggle('ring-green-500', filter==='active');
    a.classList.toggle('ring-offset-1', filter==='active');
    i.classList.toggle('ring-2', filter==='inactive');
    i.classList.toggle('ring-slate-500', filter==='inactive');
    i.classList.toggle('ring-offset-1', filter==='inactive');
    i.classList.toggle('bg-slate-100', filter==='inactive');
  }

  // ── Confirm helper ──
  function sure(msg){ return window.confirm(msg); }

  // ── Per-row command ──
  function rowCmd(id, action){
    const a = agentData[id] || {};
    const name = a.label || id;
    const verb = { start:'Start', mute:'Mute', unmute:'Unmute', split:'Split transcript for', leave:'Leave (session continues) for', end:'END SESSION for everyone in' }[action] || action;
    if (!sure(`${verb} “${name}”?`)) return;
    if (action==='end' || action==='leave') intentional[id] = true;
    sendCmd(id, action);
  }
  function sendCmd(id, action){
    const cid = 'cmd-' + Date.now() + '-' + Math.random().toString(36).slice(2,6);
    db.ref('agents/'+id+'/command').set({
      id: cid, action, by: (auth.currentUser&&auth.currentUser.email)||'unknown',
      ts: firebase.database.ServerValue.TIMESTAMP
    });
  }

  // ── Bulk arm-or-fire ──
  function armOrFire(mode){
    if (armMode === null){ armMode = mode; render(); return; }
    if (armMode !== mode) return;               // another mode armed; ignore
    const ids = Object.keys(selected);
    if (!ids.length){ cancelArm(); return; }
    const verb = { start:'Start', mute:'Mute', split:'Split', end:'END SESSION for' }[mode];
    if (!sure(`${verb} ${ids.length} selected room${ids.length===1?'':'s'}?`)) return;
    ids.forEach(id => { if (mode==='end') intentional[id]=true; sendCmd(id, mode); });
    cancelArm();
  }
  function cancelArm(){ armMode = null; selected = {}; render(); }
  function toggleSel(id, el){ if (el.checked) selected[id]=true; else delete selected[id]; updateArmUI(); }
  function toggleSelectAll(el){
    document.querySelectorAll('#tbody input[type=checkbox]').forEach(cb => { cb.checked = el.checked; cb.dispatchEvent(new Event('change')); });
  }
  function updateArmUI(){
    const bulk = ['start','mute','split','end'];
    document.getElementById('bulk-cancel').hidden = armMode === null;
    document.getElementById('selectAll').hidden = armMode === null;
    const count = Object.keys(selected).length;
    bulk.forEach(m => {
      const btn = document.getElementById('bulk-'+m);
      const on = armMode === m;
      const dim = armMode && !on;
      btn.className = `border px-3 py-2 rounded-lg text-xs font-bold uppercase ${on?'bg-blue-600 text-white border-blue-600':'bg-white hover:bg-slate-50'} ${dim?'opacity-40 pointer-events-none':''}`;
    });
    if (armMode){
      const lbl = { start:'▶ Start', mute:'⏸ Mute', split:'✂ Split', end:'■ End' }[armMode];
      document.getElementById('bulk-'+armMode).textContent = `${lbl} (${count})`;
    } else {
      document.getElementById('bulk-start').textContent='▶ Start';
      document.getElementById('bulk-mute').textContent='⏸ Mute';
      document.getElementById('bulk-split').textContent='✂ Split';
      document.getElementById('bulk-end').textContent='■ End';
    }
  }

  // ── Drop alerts ──
  function triggerDrop(id, a){
    dropAlerts.push({ id, name: a.label||id, at: new Date() });
    renderDropBanner(); beep();
    if (window.Notification && Notification.permission==='granted') {
      try { new Notification('Room dropped', { body: `${a.label||id} is no longer live.` }); } catch(e){}
    }
  }
  function renderDropBanner(){
    const el = document.getElementById('dropBanner');
    if (!dropAlerts.length){ el.hidden = true; el.innerHTML=''; return; }
    el.hidden = false;
    el.innerHTML = dropAlerts.map((d,i)=>`<div class="flex items-center justify-between">
      <span class="font-black text-sm">⚠ DROPPED: ${esc(d.name)} — ${d.at.toLocaleTimeString()}</span>
      <button onclick="ackDrop(${i})" class="bg-white/20 hover:bg-white/30 px-2 py-1 rounded text-xs font-bold uppercase">Acknowledge</button></div>`).join('');
  }
  function ackDrop(i){ dropAlerts.splice(i,1); renderDropBanner(); }
  function beep(){
    try{
      if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
      const o=audioCtx.createOscillator(), g=audioCtx.createGain();
      o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.3,audioCtx.currentTime);
      o.frequency.setValueAtTime(880,audioCtx.currentTime);
      o.frequency.setValueAtTime(660,audioCtx.currentTime+0.15);
      g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.6);
      o.start(); o.stop(audioCtx.currentTime+0.6);
    }catch(e){}
  }
  document.addEventListener('DOMContentLoaded', () => {
    const ad = document.getElementById('alertDrops');
    if (ad) ad.addEventListener('change', e => {
      if (e.target.checked){
        if(!audioCtx){ try{ audioCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
        if (window.Notification && Notification.permission==='default') Notification.requestPermission();
      }
    });
  });

  // ── Clear / remove cards ──
  function removeAgent(id){
    if (!sure('Remove this card?\n(If the device is still open, it re-appears on its next check-in.)')) return;
    db.ref('agents/'+id).remove();
  }
  function clearOffline(){
    db.ref('agents').once('value').then(snap => {
      const all = snap.val() || {};
      const offline = Object.keys(all).filter(k => !all[k].online);
      if (!offline.length){ alert('No offline agents to clear.'); return; }
      if (!sure(`Remove ${offline.length} offline card${offline.length===1?'':'s'}?`)) return;
      const updates = {}; offline.forEach(k => updates[k]=null);
      db.ref('agents').update(updates);
    });
  }

  document.getElementById('search').addEventListener('input', render);
</script>
</body>
